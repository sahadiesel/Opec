name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firestore-rules.yml"
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Prepare service account credentials
        shell: bash
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "Missing GitHub secret: FIREBASE_SERVICE_ACCOUNT"
            exit 1
          fi
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules (with retry)
        shell: bash
        run: |
          set -euo pipefail
          attempts=0
          max_attempts=5
          delay_sec=20
          until [ "$attempts" -ge "$max_attempts" ]
          do
            if firebase deploy --only firestore:rules --project studio-9554558161-dc547; then
              echo "Firestore rules deployed successfully."
              exit 0
            fi
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "Deploy failed after $attempts attempts."
              exit 1
            fi
            echo "Deploy failed (attempt $attempts/$max_attempts). Retrying in ${delay_sec}s..."
            sleep "$delay_sec"
          done
